---
name: PR Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-cd:
    uses: miikkak/workflows/.github/workflows/ci-cd.yml@5f82a45fd6d3e317a77755992b472ff4694331af # main
    with:
      runner: '["self-hosted","linux","x64"]'
      test-runner: '["self-hosted","linux","x64"]'
      code-paths: >-
        '**/*.go', 'go.mod', 'go.sum', '.github/workflows/**',
        '.pre-commit-config.yaml', '.releaserc.json'
      language-setup: go
