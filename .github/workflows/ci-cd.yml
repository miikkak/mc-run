name: PR Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# ==============================================================================
# CORE SECTION - MUST BE IDENTICAL ACROSS ALL REPOS
# ==============================================================================
# These jobs should be harmonized across all repositories with repository-type
# specific adaptations (e.g., detect-changes paths differ per repo).
#
# Golden standards:
#   - Container repos: mc-server-container
#   - Non-container repos: fastly-vcl (tarball deployment variant)
#
# 3-phase CI/CD architecture:
#   Phase 1: PR Validation (this file) → pull_request trigger
#   Phase 2: Post-Merge Pipeline (cd.yml) → push to main trigger
#   Phase 3: Release & Deploy (release.yml) → tag push trigger
#
# Core jobs: detect-changes, check-trigger, test
# ==============================================================================

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - '.releaserc.json'
            docs:
              - '**/*.md'
              - '.gitignore'
              - 'LICENSE'
              - 'CLAUDE.md'
              - '.yamllint'
              - '.markdownlint.json'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'

  check-trigger:
    name: Check PR Trigger
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.result == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      skip_code_checks: ${{ steps.check.outputs.skip_code_checks }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          CODE_CHANGES="${{ needs.detect-changes.outputs.code }}"
          if [[ "$CODE_CHANGES" == "true" ]]; then
            echo "✅ Running full test suite (code changes detected)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Skipping code checks (docs-only changes)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Test Suite
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true' && needs.check-trigger.outputs.skip_code_checks == 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        if: runner.environment == 'github-hosted'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run repository tests
        run: |
          if [[ -f .github/scripts/run-tests.sh ]]; then
            bash .github/scripts/run-tests.sh
          else
            echo "ℹ️  No test script found (0/0 tests) — OK"
          fi

  release-label:
    name: Release Label Check
    uses: miikkak/workflows/.github/workflows/check-release-label.yml@main
    permissions:
      contents: read
      pull-requests: read
