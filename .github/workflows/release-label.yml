---
name: Release Label

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    name: Release Label Check
    uses: miikkak/workflows/.github/workflows/check-release-label.yml@9b5aed5e5fa9907b0f45b1e813c8efbef62e79e0 # main
    permissions:
      contents: read
      pull-requests: read
