---
name: Release Label

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    name: Release Label Check
    uses: miikkak/workflows/.github/workflows/check-release-label.yml@0ee8784d90edaa81f1b9dcd6a0c4a7ea0d7e4095 # main
    permissions:
      contents: read
      pull-requests: read
