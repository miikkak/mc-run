---
name: Dependabot Automerge

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    name: Dependabot Automerge
    uses: miikkak/workflows/.github/workflows/dependabot-automerge.yml@a5b1f78c794bab3e5e9daf7f0b5dac18aad899b2 # main
    secrets:
      PULL_REQUEST_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
