---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g., v1.2.3)"
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' && inputs.tag || github.ref
    }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: miikkak/workflows/.github/workflows/release-go.yml@61ba43c364d848ada74ee122b5631811e0460890 # main
    with:
      binary: mc-run
      extra-files: "README.md LICENSE"
      tag: ${{ inputs.tag || '' }}
