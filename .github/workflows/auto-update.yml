---
name: Auto-Update Dependencies

on: # yamllint disable-line rule:truthy
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update check even if no updates available'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-update:
    uses: miikkak/workflows/.github/workflows/auto-update.yml@e939711630e0f2ff79656e310ecae181a0527f43 # main
    secrets: inherit
    with:
      force: ${{ inputs.force || false }}
