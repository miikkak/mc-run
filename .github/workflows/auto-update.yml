---
name: Auto-Update Dependencies

on: # yamllint disable-line rule:truthy
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update check even if no updates available'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-update:
    uses: miikkak/workflows/.github/workflows/auto-update.yml@9cf5b8444ae2c6e19012809b6b14302188a8bcf4 # main
    secrets: inherit
    with:
      force: ${{ inputs.force || false }}
