---
name: Post-Merge Pipeline

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cd:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: miikkak/workflows/.github/workflows/cd.yml@1af23b5c03a991c89be58a577787a604458197ba # main
    secrets:
      SEMANTIC_RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
    with:
      runner: '["self-hosted","linux","x64"]'
      test-runner: '["self-hosted","linux","x64"]'
      code-paths: >-
        '**/*.go', 'go.mod', 'go.sum', '.github/workflows/**',
        '.pre-commit-config.yaml', '.releaserc.json'
      language-setup: go
